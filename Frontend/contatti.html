<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/shared.css">
    <link rel="stylesheet" href="style/azienda.css">
    <link rel="stylesheet" href="style/contatti.css">
    <title>Contatti</title>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <h1>Contatti</h1>
        </div>
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="menu">
            <a class="menu-link" href="azienda.html">Aziende</a>
            <a class="menu-link" href="email.html">Tipo-Email</a>
            <a class="menu-link" href="numeri.html">Tipo-Numeri</a>
            <label class="theme-switch" for="theme-toggle" aria-label="Attiva tema scuro">
                <span class="theme-icon sun" aria-hidden="true">☀</span>
                <input type="checkbox" id="theme-toggle" class="theme-switch-input" aria-label="Switch tema chiaro e scuro">
                <span class="theme-slider" aria-hidden="true"></span>
                <span class="theme-icon moon" aria-hidden="true">☾</span>
            </label>
        </div>
    </div>
    <div class="menu-overlay"></div>
    <main class="page-container">
        <section class="content-section">
            <div class="toolbar">
                <button id="add-contact-btn" class="add-company-btn" aria-haspopup="dialog">
                    Aggiungi Contatto
                </button>
            </div>

            <div id="add-contact-panel"
                 class="add-company-panel"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="add-contact-title"
                 style="display:none;">
                <h2 id="add-contact-title">Aggiungi Nuovo Contatto</h2>
                <form id="add-contact-form" novalidate>
                    <label for="contact-name">Nome</label>
                    <input type="text" id="contact-name" placeholder="Es. Mario" required>

                    <label for="contact-surname">Cognome</label>
                    <input type="text" id="contact-surname" placeholder="Es. Rossi" required>

                    <label for="contact-company">Azienda</label>
                    <select id="contact-company">
                        <option value="">Seleziona azienda</option>
                    </select>

                    <label for="contact-title">Titolo</label>
                    <input type="text" id="contact-title" placeholder="Es. Dott.">

                    <label for="contact-work-role">Ruolo</label>
                    <input type="text" id="contact-work-role" placeholder="Es. Sales Manager">

                    <label for="contact-gender">Genere</label>
                    <select id="contact-gender">
                        <option value="">Seleziona genere</option>
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>

                    <label for="contact-birthday">Data di nascita</label>
                    <input type="date" id="contact-birthday" required>

                    <label for="contact-note">Note</label>
                    <textarea id="contact-note" rows="3" placeholder="Informazioni aggiuntive..."></textarea>

                    <p id="add-contact-error" class="form-error" role="alert" aria-live="polite"></p>

                    <div class="form-buttons">
                        <button type="submit">Salva</button>
                        <button type="button" id="cancel-add-contact">Annulla</button>
                    </div>
                </form>
            </div>

            <div id="edit-contact-panel"
                 class="add-company-panel"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="edit-contact-title"
                 style="display:none;">
                <h2 id="edit-contact-title">Modifica Contatto</h2>
                <form id="edit-contact-form" novalidate>
                    <input type="hidden" id="edit-contact-id">
                    <input type="hidden" id="edit-contact-date-added">

                    <label for="edit-contact-name">Nome</label>
                    <input type="text" id="edit-contact-name" required>

                    <label for="edit-contact-surname">Cognome</label>
                    <input type="text" id="edit-contact-surname" required>

                    <label for="edit-contact-company">Azienda</label>
                    <select id="edit-contact-company">
                        <option value="">Seleziona azienda</option>
                    </select>

                    <label for="edit-contact-title-input">Titolo</label>
                    <input type="text" id="edit-contact-title-input">

                    <label for="edit-contact-work-role">Ruolo</label>
                    <input type="text" id="edit-contact-work-role">

                    <label for="edit-contact-type-denomination">Tipo contatto</label>
                    <select id="edit-contact-type-denomination">
                        <option value="">Seleziona tipo contatto</option>
                    </select>

                    <label for="edit-contact-category">Categoria</label>
                    <select id="edit-contact-category">
                        <option value="">Seleziona categoria</option>
                    </select>

                    <label for="edit-contact-gender">Genere</label>
                    <select id="edit-contact-gender">
                        <option value="">Seleziona genere</option>
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>

                    <label for="edit-contact-birthday">Data di nascita</label>
                    <input type="date" id="edit-contact-birthday" required>
                    
                    <label class="contact-channels-start">Email</label>
                    <div class="contact-subitems-block contact-channels-start-block">
                        <div id="edit-contact-emails-list" class="contact-subitems-list"></div>
                        <button type="button" id="edit-contact-email-add-btn" class="secondary-inline-btn">Aggiungi email</button>
                    </div>

                    <label>Telefoni</label>
                    <div class="contact-subitems-block">
                        <div id="edit-contact-phones-list" class="contact-subitems-list"></div>
                        <button type="button" id="edit-contact-phone-add-btn" class="secondary-inline-btn">Aggiungi numero</button>
                    </div>

                    <label for="edit-contact-note">Note</label>
                    <textarea id="edit-contact-note" rows="3"></textarea>

                    <p id="edit-contact-error" class="form-error" role="alert" aria-live="polite"></p>

                    <div class="form-buttons">
                        <button type="submit">Salva Modifiche</button>
                        <button type="button" id="cancel-edit-contact">Annulla</button>
                    </div>
                </form>
            </div>

            <div class="table-wrapper">
                <table class="table-contact" aria-label="Elenco contatti">
                    <thead>
                        <tr>
                            <th scope="col">Nome </th>
                            <th scope="col">Cognome</th>
                            <th scope="col">Azienda</th>
                            <th scope="col">Titolo</th>
                            <th scope="col">Ruolo</th>
                            <th scope="col">Sesso</th>
                            <th scope="col">Data di nascita</th>
                            <th scope="col">Note</th>
                            <th scope="col">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="table-contact-body">
                    </tbody>
                </table>
            </div>

            <div id="company-popup-overlay" class="company-popup-overlay" hidden>
                <div class="company-popup" role="dialog" aria-modal="true" aria-labelledby="company-popup-title" aria-describedby="company-popup-message">
                    <h3 id="company-popup-title">Conferma azione</h3>
                    <p id="company-popup-message"></p>
                    <div class="company-popup-actions">
                        <button type="button" id="company-popup-cancel" class="company-popup-btn company-popup-btn-secondary">Annulla</button>
                        <button type="button" id="company-popup-confirm" class="company-popup-btn company-popup-btn-primary">Conferma</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="src/contacts.js"></script>
</body>
</html>
