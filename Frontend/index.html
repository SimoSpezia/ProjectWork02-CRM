<!DOCTYPE html>
<html lang="it">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="style/shared.css">
       <link rel="stylesheet" href="style/azienda.css">
       <title>Aziende</title>
</head>

<body>

       <!-- ========== HEADER ========== -->
       <header class="header">
              <div class="header-title">
                     <h1>Aziende</h1>
              </div>
              <button class="menu-toggle" aria-label="Apri menu" aria-expanded="false">☰</button>
              <nav class="menu" role="navigation" aria-label="Menu principale">
                     <a class="menu-link" href="contatti.html">Contatti</a>
                     <a class="menu-link" href="index.html">Aziende</a>
                     <a class="menu-link" href="email.html">Tipo-Email</a>
                     <a class="menu-link" href="numeri.html">Tipo-Numeri</a>
                     <label class="theme-switch" for="theme-toggle" aria-label="Attiva tema scuro">
                            <span class="theme-icon sun" aria-hidden="true">☀</span>
                            <input type="checkbox" id="theme-toggle" class="theme-switch-input"
                                   aria-label="Switch tema chiaro e scuro">
                            <span class="theme-slider" aria-hidden="true"></span>
                            <span class="theme-icon moon" aria-hidden="true">☾</span>
                     </label>
              </nav>
       </header>
       <div class="menu-overlay" aria-hidden="true"></div>

       <!-- ========== CONTENUTO PAGINA ========== -->
       <main class="page-container">
              <section class="content-section">

                     <!-- Toolbar -->
                     <div class="toolbar">
                            <button id="add-company-btn" class="add-company-btn" aria-haspopup="dialog">
                                   Aggiungi Azienda
                            </button>
                     </div>

                     <!--  PANNELLO: AGGIUNGI AZIENDA  -->
                     <div id="add-company-panel" class="add-company-panel" role="dialog" aria-modal="true"
                            aria-labelledby="add-panel-title" style="display:none;">

                            <h2 id="add-panel-title">Aggiungi Nuova Azienda</h2>

                            <form id="add-company-form" novalidate>

                                   <label for="company-name">Nome Azienda</label>
                                   <input type="text" id="company-name" placeholder="Es. Acme S.r.l."
                                          autocomplete="organization" required>

                                   <!-- Indirizzo strutturato — ID allineati con azienda.ts -->
                                   <div id="edit-company-address-form">
                                          <label for="company-address-country">Nazione</label>
                                          <select id="company-address-country" required>
                                                 <option value="">Seleziona nazione</option>
                                          </select>

                                          <label for="company-address-region">Regione</label>
                                          <input type="text" id="company-address-region" placeholder="Inserisci regione"
                                                 required>

                                          <label for="company-address-province">Provincia</label>
                                          <input type="text" id="company-address-province"
                                                 placeholder="Inserisci provincia" required>

                                          <label for="company-address-city">Città</label>
                                          <input type="text" id="company-address-city" placeholder="Inserisci città"
                                                 required>

                                          <label for="company-address-zip">CAP</label>
                                          <input type="text" id="company-address-zip" placeholder="20100"
                                                 inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required>

                                          <label for="company-address-street">Via / Piazza</label>
                                          <input type="text" id="company-address-street" placeholder="Via Roma"
                                                 required>

                                          <label for="company-address-streetNumber">Numero civico</label>
                                          <input type="text" id="company-address-streetNumber" placeholder="1">
                                   </div>

                                   <label for="company-partitaIVA">Partita IVA</label>
                                   <input type="text" id="company-partitaIVA" placeholder="IT12345678901" maxlength="13"
                                          required>

                                   <label for="company-size">Dimensione</label>
                                   <input type="text" id="company-size" placeholder="Es. 50 dipendenti">

                                   <label for="company-website">Sito Web</label>
                                   <input type="url" id="company-website" placeholder="https://www.esempio.it">

                                   <label for="company-notes">Note</label>
                                   <textarea id="company-notes"
                                          placeholder="Informazioni aggiuntive sull'azienda..."></textarea>

                                   <p id="add-company-error" class="form-error" role="alert" aria-live="polite"></p>

                                   <div class="form-buttons">
                                          <button type="submit">Salva</button>
                                          <button type="button" id="cancel-add-company">Annulla</button>
                                   </div>

                            </form>
                     </div>

                     <!--  PANNELLO: MODIFICA AZIENDA  -->
                     <div id="edit-company-panel" class="add-company-panel" role="dialog" aria-modal="true"
                            aria-labelledby="edit-panel-title" style="display:none;">

                            <h2 id="edit-panel-title">Modifica Azienda</h2>

                            <form id="edit-company-form" novalidate>

                                   <label for="edit-company-name">Nome Azienda</label>
                                   <input type="text" id="edit-company-name" placeholder="Es. Acme S.r.l."
                                          autocomplete="organization" required>

                                   <div id="edit-company-address-form">
                                          <label for="edit-company-address-country">Nazione</label>
                                          <select id="edit-company-address-country" required>
                                                 <option value="">Seleziona nazione</option>
                                          </select>

                                          <label for="edit-company-address-region">Regione</label>
                                          <input type="text" id="edit-company-address-region"
                                                 placeholder="Inserisci regione" required>

                                          <label for="edit-company-address-province">Provincia</label>
                                          <input type="text" id="edit-company-address-province"
                                                 placeholder="Inserisci provincia" required>

                                          <label for="edit-company-address-city">Città</label>
                                          <input type="text" id="edit-company-address-city"
                                                 placeholder="Inserisci città" required>

                                          <label for="edit-company-address-zip">CAP</label>
                                          <input type="text" id="edit-company-address-zip" placeholder="20100"
                                                 inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required>

                                          <label for="edit-company-address-street">Via / Piazza</label>
                                          <input type="text" id="edit-company-address-street" placeholder="Via Roma"
                                                 required>

                                          <label for="edit-company-address-streetNumber">Numero civico</label>
                                          <input type="text" id="edit-company-address-streetNumber" placeholder="1">
                                   </div>

                                   <label for="edit-company-partitaIVA">Partita IVA</label>
                                   <input type="text" id="edit-company-partitaIVA" placeholder="IT12345678901"
                                          maxlength="13" required>

                                   <label for="edit-company-size">Dimensione</label>
                                   <input type="text" id="edit-company-size" placeholder="Es. 50 dipendenti">

                                   <label for="edit-company-website">Sito Web</label>
                                   <input type="url" id="edit-company-website" placeholder="https://www.esempio.it">

                                   <label for="edit-company-notes">Note</label>
                                   <textarea id="edit-company-notes"
                                          placeholder="Informazioni aggiuntive sull'azienda..."></textarea>

                                   <div class="company-contacts-section" aria-label="Contatti associati all'azienda">
                                          <div class="company-contacts-header">
                                                 <h3>Contatti associati</h3>
                                                 <button type="button" id="edit-company-contact-row"
                                                        class="contact-add-btn">Aggiungi contatto</button>
                                          </div>
                                          <div id="edit-company-contacts-list" class="company-contacts-list"></div>
                                   </div>

                                   <p id="edit-company-error" class="form-error" role="alert" aria-live="polite"></p>

                                   <div class="form-buttons">
                                          <button type="submit">Salva Modifiche</button>
                                          <button type="button" id="cancel-edit-company">Annulla</button>
                                   </div>

                            </form>
                     </div>

                     <!--  PANNELLO: DETTAGLIO AZIENDA  -->
                     <div id="company-detail-panel" class="info-company-panel" role="dialog" aria-modal="true"
                            aria-labelledby="detail-panel-title" style="display:none;">

                            <h2 id="detail-panel-title">Dettagli Azienda</h2>

                            <div id="company-detail-content">
                                   <div id="company-detail-name"></div>
                                   <div id="company-detail-address"></div>
                                   <div id="company-detail-partitaIVA"></div>
                                   <div id="company-detail-size"></div>
                                   <div id="company-detail-website"></div>
                                   <div id="company-detail-contacts"></div>
                                   <div id="company-detail-notes"></div>

                            </div>

                            <button type="button" id="close-detail-panel">Chiudi</button>
                     </div>

                     <!-- ===== TABELLA AZIENDE ===== -->
                     <div class="table-wrapper">
                            <table class="table-company" aria-label="Elenco aziende">
                                   <thead>
                                          <tr>
                                                 <th scope="col">Nome Azienda</th>
                                                 <th scope="col">Indirizzo</th>
                                                 <th scope="col">Sito Web</th>
                                                 <th scope="col">Partita IVA</th>
                                                 <th scope="col">Dimensione</th>
                                                 <th scope="col">Note</th>
                                                 <th scope="col">Azioni</th>
                                          </tr>
                                   </thead>
                                   <tbody id="table-company-body">
                                   </tbody>
                            </table>
                     </div>

              </section>
       </main>

       <div id="company-popup-overlay" class="company-popup-overlay" hidden>
              <div class="company-popup" role="dialog" aria-modal="true" aria-labelledby="company-popup-title"
                     aria-describedby="company-popup-message">
                     <h3 id="company-popup-title">Conferma azione</h3>
                     <p id="company-popup-message"></p>
                     <div class="company-popup-actions">
                            <button type="button" id="company-popup-cancel"
                                   class="company-popup-btn company-popup-btn-secondary">Annulla</button>
                            <button type="button" id="company-popup-confirm"
                                   class="company-popup-btn company-popup-btn-primary">Conferma</button>
                     </div>
              </div>
       </div>

       <script type="module" src="src/azienda.js"></script>
</body>

</html>
